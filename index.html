<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBMTO — Painel de Acompanhamento do Planejamento Estratégico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12161a;
    --bg-2: #171c21;
    --surface: #1d2329;
    --surface-2: #242b32;
    --line: #2c343c;
    --text: #eef1f3;
    --text-dim: #a8b2ba;
    --text-faint: #6b7580;
    --red: #d62839;
    --red-dim: #7a1f28;
    --amber: #e8a33d;
    --amber-dim: #6b4f1e;
    --green: #3fa373;
    --green-dim: #1f4a37;
    --gray: #4a545e;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(214,40,57,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  /* HEADER */
  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:20px;margin-bottom:22px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand svg{flex-shrink:0;}
  .brand img{width:46px;height:46px;object-fit:contain;flex-shrink:0;}
  .brand h1{
    font-family:'Oswald',sans-serif;font-weight:600;
    font-size:22px;letter-spacing:0.03em;text-transform:uppercase;
    margin:0;color:var(--text);
  }
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--text-faint);letter-spacing:0.02em;}
  .updated{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-faint);
    text-align:right;line-height:1.6;
  }
  .updated b{color:var(--text-dim);}

  /* BREADCRUMB */
  .breadcrumb{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin-bottom:20px;font-size:13px;color:var(--text-faint);
  }
  .breadcrumb .crumb{
    cursor:pointer;padding:5px 10px;border-radius:6px;
    transition:background .15s, color .15s;
  }
  .breadcrumb .crumb:hover{background:var(--surface-2);color:var(--text);}
  .breadcrumb .crumb.current{color:var(--text);font-weight:600;cursor:default;}
  .breadcrumb .crumb.current:hover{background:none;}
  .breadcrumb .sep{color:var(--gray);font-size:11px;}

  /* SUMMARY STRIP */
  .summary{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;
  }
  .stat{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat .n{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;color:var(--text);}
  .stat .l{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}
  .stat.accent .n{color:var(--red);}

  /* SECTION TITLES */
  .section-title{
    font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;
    text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);
    margin:0 0 14px;display:flex;align-items:center;gap:10px;
  }
  .section-title .count{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:400;
    color:var(--text-faint);background:var(--surface-2);padding:2px 8px;border-radius:20px;
  }

  /* GRID OF OBJETIVO CARDS */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.grid{grid-template-columns:1fr;}}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;cursor:pointer;transition:transform .15s, border-color .15s, background .15s;
    display:flex;flex-direction:column;gap:12px;
  }
  .card:hover{border-color:var(--red-dim);background:var(--surface-2);transform:translateY(-2px);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-title{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;line-height:1.25;}
  .card-sub{font-size:11.5px;color:var(--text-faint);margin-top:4px;}
  .gauge-wrap{display:flex;align-items:center;gap:14px;}
  .gauge-readout{display:flex;flex-direction:column;}
  .gauge-pct{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;}
  .gauge-label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;}

  .mini-metrics{display:flex;gap:14px;font-size:11.5px;color:var(--text-dim);border-top:1px solid var(--line);padding-top:10px;}
  .mini-metrics span b{color:var(--text);font-family:'IBM Plex Mono',monospace;font-weight:500;}

  .arrow-hint{align-self:flex-end;color:var(--text-faint);font-size:12px;}

  /* DETAIL HEADER (objetivo / iniciativa view) */
  .detail-head{
    display:flex;justify-content:space-between;align-items:center;gap:20px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 26px;margin-bottom:26px;flex-wrap:wrap;
  }
  .detail-head h2{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;margin:0 0 6px;text-transform:uppercase;letter-spacing:0.02em;}
  .detail-head .meta{font-size:12.5px;color:var(--text-faint);}
  .detail-gauge-readout{text-align:right;}
  .detail-gauge-readout .gauge-pct{font-size:34px;}

  /* LIST ROWS (iniciativas within objetivo) */
  .list{display:flex;flex-direction:column;gap:10px;}
  .row-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;display:flex;align-items:center;gap:18px;cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .row-card:hover{border-color:var(--red-dim);background:var(--surface-2);}
  .row-card .row-idx{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);
    width:34px;flex-shrink:0;
  }
  .row-main{flex:1;min-width:0;}
  .row-main .t{font-weight:500;font-size:14.5px;line-height:1.3;}
  .row-main .s{font-size:11.5px;color:var(--text-faint);margin-top:3px;}
  .bar-track{width:150px;height:7px;background:var(--surface-2);border-radius:5px;overflow:hidden;flex-shrink:0;}
  .bar-fill{height:100%;border-radius:5px;transition:width .4s ease;}
  .row-pct{
    font-family:'IBM Plex Mono',monospace;font-size:13px;width:46px;text-align:right;flex-shrink:0;
  }
  .chev{color:var(--text-faint);font-size:16px;flex-shrink:0;}

  /* ACOES TABLE */
  table.acoes{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  table.acoes th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--text-faint);font-weight:600;padding:12px 16px;background:var(--bg-2);
    border-bottom:1px solid var(--line);
  }
  table.acoes td{padding:14px 16px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.acoes tr:last-child td{border-bottom:none;}
  table.acoes td.t-title{font-weight:500;max-width:340px;}
  table.acoes td.t-desc{color:var(--text-faint);font-size:12px;margin-top:3px;}
  .badge{
    display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:0.03em;
  }
  .badge.concluida{background:var(--green-dim);color:#8fe0bb;}
  .badge.andamento{background:var(--amber-dim);color:#f4c778;}
  .badge.atrasada{background:var(--red-dim);color:#f5a1a9;}
  .badge.prio-ALTA{background:var(--red-dim);color:#f5a1a9;}
  .badge.prio-MEDIA{background:var(--amber-dim);color:#f4c778;}
  .badge.prio-BAIXA{background:var(--surface-2);color:var(--text-dim);}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);}

  .empty{
    text-align:center;padding:50px 20px;color:var(--text-faint);
    background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
    font-size:13.5px;
  }

  .note{
    margin-top:30px;padding:14px 18px;background:var(--surface);border-left:3px solid var(--amber);
    border-radius:6px;font-size:12.5px;color:var(--text-dim);line-height:1.6;
  }
  .note b{color:var(--text);}

  .view{display:none;}
  .view.active{display:block;}
</style>
</head>

// ---------- helpers ----------
const todayLabelEl = document.getElementById('today-label');
const today = new Date();
todayLabelEl.textContent = 'Atualizado em ' + today.toLocaleDateString('pt-BR');

function statusOf(acao){
  if(acao.CONCLUSAO){ return 'concluida'; }
  if(acao.PREVISAO){
    const prev = new Date(acao.PREVISAO + 'T23:59:59');
    if(prev < today) return 'atrasada';
  }
  return 'andamento';
}
const STATUS_LABEL = {concluida:'Concluída', andamento:'Em andamento', atrasada:'Atrasada'};
const STATUS_COLOR = {concluida:'var(--green)', andamento:'var(--amber)', atrasada:'var(--red)'};

function pctColor(pct){
  if(pct === null) return 'var(--gray)';
  if(pct < 40) return 'var(--red)';
  if(pct < 75) return 'var(--amber)';
  return 'var(--green)';
}

function acoesOf(iniciativaId){
  return DATA.acoes.filter(a => a.CODINICIATIVAESTRATEGICA === iniciativaId && a.EXCLUIDO === 0);
}
function iniciativasOf(objetivoId){
  return DATA.iniciativas.filter(i => i.CODOBJETIVOESTRATEGICO === objetivoId && i.EXCLUIDO === 0);
}
function iniciativaStats(iniciativaId){
  const acoes = acoesOf(iniciativaId);
  const total = acoes.length;
  const concluidas = acoes.filter(a => statusOf(a) === 'concluida').length;
  const atrasadas = acoes.filter(a => statusOf(a) === 'atrasada').length;
  const pct = total ? Math.round((concluidas/total)*100) : null;
  return {total, concluidas, atrasadas, pct};
}
function objetivoStats(objetivoId){
  const inis = iniciativasOf(objetivoId);
  let totalAcoes = 0, concluidas = 0;
  inis.forEach(i => { const s = iniciativaStats(i.CODINICIATIVAESTRATEGICA); totalAcoes += s.total; concluidas += s.concluidas; });
  const pct = totalAcoes ? Math.round((concluidas/totalAcoes)*100) : null;
  return {iniciativasTotal: inis.length, totalAcoes, concluidas, pct};
}

// build objetivo list incl. "não vinculado" bucket
const objetivoIds = new Set(DATA.objetivos.map(o => o.CODOBJETIVOESTRATEGICO));
const orphanObjIds = [...new Set(DATA.iniciativas.filter(i => !objetivoIds.has(i.CODOBJETIVOESTRATEGICO)).map(i => i.CODOBJETIVOESTRATEGICO))];
let objetivosList = DATA.objetivos.filter(o => o.EXCLUIDO === 0).map(o => ({...o}));
if(orphanObjIds.length){
  objetivosList.push({CODOBJETIVOESTRATEGICO: '__orphan__', TITULO: 'Não vinculado', ORPHAN_IDS: orphanObjIds});
}

function getIniciativasForObjCard(obj){
  if(obj.CODOBJETIVOESTRATEGICO === '__orphan__'){
    return DATA.iniciativas.filter(i => obj.ORPHAN_IDS.includes(i.CODOBJETIVOESTRATEGICO) && i.EXCLUIDO === 0);
  }
  return iniciativasOf(obj.CODOBJETIVOESTRATEGICO);
}
function getStatsForObjCard(obj){
  if(obj.CODOBJETIVOESTRATEGICO === '__orphan__'){
    const inis = getIniciativasForObjCard(obj);
    let totalAcoes = 0, concluidas = 0;
    inis.forEach(i => { const s = iniciativaStats(i.CODINICIATIVAESTRATEGICA); totalAcoes += s.total; concluidas += s.concluidas; });
    const pct = totalAcoes ? Math.round((concluidas/totalAcoes)*100) : null;
    return {iniciativasTotal: inis.length, totalAcoes, concluidas, pct};
  }
  return objetivoStats(obj.CODOBJETIVOESTRATEGICO);
}

// ---------- gauge SVG (manometer style) ----------
function polar(cx, cy, r, angleDeg){
  const a = (angleDeg - 180) * Math.PI/180;
  return {x: cx + r*Math.cos(a), y: cy + r*Math.sin(a)};
}
function arcPath(cx, cy, r, startAngle, endAngle){
  const s = polar(cx, cy, r, startAngle);
  const e = polar(cx, cy, r, endAngle);
  const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
  return `M ${s.x} ${s.y} A ${r} ${r} 0 ${largeArc} 1 ${e.x} ${e.y}`;
}
function gaugeSVG(pct, size){
  size = size || 88;
  const cx = size/2, cy = size*0.62, r = size*0.42;
  const p = pct === null ? 0 : pct;
  const needleAngle = (p/100)*180; // 0..180
  const needleTip = polar(cx, cy, r*0.86, needleAngle);
  const color = pctColor(pct);
  return `
  <svg width="${size}" height="${size*0.68}" viewBox="0 0 ${size} ${size*0.68}">
    <path d="${arcPath(cx,cy,r,0,72)}" stroke="#7a1f28" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="${arcPath(cx,cy,r,72,126)}" stroke="#6b4f1e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="${arcPath(cx,cy,r,126,180)}" stroke="#1f4a37" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="${arcPath(cx,cy,r,0,180)}" stroke="#2c343c" stroke-width="6" fill="none" stroke-linecap="round" opacity="${pct===null?1:0}"/>
    <line x1="${cx}" y1="${cy}" x2="${needleTip.x}" y2="${needleTip.y}" stroke="${pct===null?'var(--gray)':color}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="${pct===null?'var(--gray)':color}"/>
  </svg>`;
}

// ---------- rendering ----------
const breadcrumbEl = document.getElementById('breadcrumb');
const views = {
  overview: document.getElementById('view-overview'),
  objetivo: document.getElementById('view-objetivo'),
  iniciativa: document.getElementById('view-iniciativa'),
};

function setBreadcrumb(items){
  breadcrumbEl.innerHTML = items.map((it, idx) => {
    const isLast = idx === items.length-1;
    return `<span class="crumb ${isLast?'current':''}" ${isLast?'':`onclick="${it.action}"`}>${it.label}</span>` +
           (isLast?'':'<span class="sep">›</span>');
  }).join('');
}

function showView(name){
  Object.values(views).forEach(v => v.classList.remove('active'));
  views[name].classList.add('active');
}

function renderOverview(){
  showView('overview');
  setBreadcrumb([{label:'Visão Geral'}]);

  // summary strip
  const totalObj = objetivosList.length;
  const totalIni = DATA.iniciativas.filter(i=>i.EXCLUIDO===0).length;
  const totalAcoesArr = DATA.acoes.filter(a=>a.EXCLUIDO===0);
  const totalAcoesN = totalAcoesArr.length;
  const concluidasN = totalAcoesArr.filter(a=>statusOf(a)==='concluida').length;
  const globalPct = totalAcoesN ? Math.round((concluidasN/totalAcoesN)*100) : null;

  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="n">${totalObj}</div><div class="l">Objetivos</div></div>
    <div class="stat"><div class="n">${totalIni}</div><div class="l">Iniciativas</div></div>
    <div class="stat"><div class="n">${totalAcoesN}</div><div class="l">Ações cadastradas</div></div>
    <div class="stat accent"><div class="n">${globalPct===null?'—':globalPct+'%'}</div><div class="l">Conclusão geral</div></div>
  `;
  document.getElementById('obj-count').textContent = totalObj;

  const grid = document.getElementById('grid-objetivos');
  grid.innerHTML = objetivosList.map(obj => {
    const stats = getStatsForObjCard(obj);
    const pctDisplay = stats.pct === null ? '—' : stats.pct + '%';
    return `
    <div class="card" onclick="openObjetivo('${obj.CODOBJETIVOESTRATEGICO}')">
      <div class="card-top">
        <div>
          <div class="card-title">${obj.TITULO}</div>
          <div class="card-sub">${stats.iniciativasTotal} iniciativa${stats.iniciativasTotal===1?'':'s'}</div>
        </div>
      </div>
      <div class="gauge-wrap">
        ${gaugeSVG(stats.pct, 84)}
        <div class="gauge-readout">
          <div class="gauge-pct" style="color:${pctColor(stats.pct)}">${pctDisplay}</div>
          <div class="gauge-label">concluído</div>
        </div>
      </div>
      <div class="mini-metrics">
        <span>Ações: <b>${stats.totalAcoes}</b></span>
        <span>Concluídas: <b>${stats.concluidas}</b></span>
      </div>
    </div>`;
  }).join('');
}

let currentObj = null;
function openObjetivo(codRaw){
  const cod = codRaw === '__orphan__' ? '__orphan__' : Number(codRaw);
  const obj = objetivosList.find(o => o.CODOBJETIVOESTRATEGICO === cod);
  currentObj = obj;
  showView('objetivo');
  setBreadcrumb([
    {label:'Visão Geral', action:'renderOverview()'},
    {label:obj.TITULO}
  ]);

  const stats = getStatsForObjCard(obj);
  const pctDisplay = stats.pct === null ? '—' : stats.pct + '%';
  document.getElementById('objetivo-head').innerHTML = `
    <div>
      <h2>${obj.TITULO}</h2>
      <div class="meta">${stats.iniciativasTotal} iniciativas · ${stats.totalAcoes} ações · ${stats.concluidas} concluídas</div>
    </div>
    <div class="gauge-wrap">
      ${gaugeSVG(stats.pct, 96)}
      <div class="detail-gauge-readout">
        <div class="gauge-pct" style="color:${pctColor(stats.pct)}">${pctDisplay}</div>
        <div class="gauge-label">concluído</div>
      </div>
    </div>
  `;

  const inis = getIniciativasForObjCard(obj);
  document.getElementById('ini-count').textContent = inis.length;
  const listEl = document.getElementById('list-iniciativas');
  if(!inis.length){
    listEl.innerHTML = `<div class="empty">Nenhuma iniciativa vinculada a este objetivo.</div>`;
    return;
  }
  listEl.innerHTML = inis.map((ini, idx) => {
    const s = iniciativaStats(ini.CODINICIATIVAESTRATEGICA);
    const pctDisplay = s.pct === null ? '—' : s.pct + '%';
    const barColor = pctColor(s.pct);
    const subLabel = s.total ? `${s.concluidas}/${s.total} ações concluídas${s.atrasadas?` · ${s.atrasadas} atrasada${s.atrasadas===1?'':'s'}`:''}` : 'Nenhuma ação cadastrada';
    return `
    <div class="row-card" onclick="openIniciativa(${ini.CODINICIATIVAESTRATEGICA})">
      <div class="row-idx">#${String(ini.CODINICIATIVAESTRATEGICA).padStart(3,'0')}</div>
      <div class="row-main">
        <div class="t">${ini.TITULO}</div>
        <div class="s">${subLabel}</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${s.pct||0}%;background:${barColor}"></div></div>
      <div class="row-pct" style="color:${barColor}">${pctDisplay}</div>
      <div class="chev">›</div>
    </div>`;
  }).join('');
}

function openIniciativa(iniId){
  const ini = DATA.iniciativas.find(i => i.CODINICIATIVAESTRATEGICA === iniId);
  showView('iniciativa');
  setBreadcrumb([
    {label:'Visão Geral', action:'renderOverview()'},
    {label: currentObj ? currentObj.TITULO : 'Objetivo', action:`openObjetivo('${currentObj ? currentObj.CODOBJETIVOESTRATEGICO : ''}')`},
    {label: ini.TITULO}
  ]);

  const s = iniciativaStats(iniId);
  const pctDisplay = s.pct === null ? '—' : s.pct + '%';
  document.getElementById('iniciativa-head').innerHTML = `
    <div>
      <h2>${ini.TITULO}</h2>
      <div class="meta">${ini.DESCRICAO && ini.DESCRICAO !== ini.TITULO ? ini.DESCRICAO+' · ' : ''}Ano ${ini.ANO || '—'}</div>
    </div>
    <div class="gauge-wrap">
      ${gaugeSVG(s.pct, 96)}
      <div class="detail-gauge-readout">
        <div class="gauge-pct" style="color:${pctColor(s.pct)}">${pctDisplay}</div>
        <div class="gauge-label">concluído</div>
      </div>
    </div>
  `;

  const acoes = acoesOf(iniId);
  document.getElementById('acao-count').textContent = acoes.length;
  const container = document.getElementById('acoes-container');
  if(!acoes.length){
    container.innerHTML = `<div class="empty">Nenhuma ação cadastrada para esta iniciativa ainda.</div>`;
    return;
  }
  const fmtMoney = v => v==null ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR');
  const fmtDate = v => v ? new Date(v+'T00:00:00').toLocaleDateString('pt-BR') : '—';
  container.innerHTML = `
  <table class="acoes">
    <thead>
      <tr>
        <th style="width:34%">Ação</th>
        <th>Status</th>
        <th>Prioridade</th>
        <th>Início</th>
        <th>Previsão</th>
        <th>Conclusão</th>
        <th>Custo</th>
      </tr>
    </thead>
    <tbody>
      ${acoes.map(a => {
        const st = statusOf(a);
        return `
        <tr>
          <td class="t-title">${a.TITULO}${a.DESCRICAO ? `<div class="t-desc">${a.DESCRICAO}</div>` : ''}</td>
          <td><span class="badge ${st}">${STATUS_LABEL[st]}</span></td>
          <td><span class="badge prio-${a.PRIORIDADE}">${a.PRIORIDADE}</span></td>
          <td class="mono">${fmtDate(a.INICIO)}</td>
          <td class="mono">${fmtDate(a.PREVISAO)}</td>
          <td class="mono">${fmtDate(a.CONCLUSAO)}</td>
          <td class="mono">${fmtMoney(a.CUSTO)}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;
}

renderOverview();
</script>
</body>
</html>
